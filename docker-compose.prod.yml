version: "3.9"

services:
  talentup-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talentup_autonomous_core
    restart: unless-stopped
    ports:
      - "8088:8088"
    env_file:
      - ./04_CONFIG/.env
    volumes:
      - talentup_db_data:/app/02_ENGINEERING/backend
    networks:
      - talentup_net

  caddy-tls-proxy:
    image: caddy:2-alpine
    container_name: talentup_caddy_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./05_DEPLOY/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - talentup-core
    networks:
      - talentup_net

volumes:
  talentup_db_data:
  caddy_data:
  caddy_config:

networks:
  talentup_net:
    driver: bridge
